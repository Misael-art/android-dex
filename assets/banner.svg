<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Android-DEX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" rx="0" fill="url(#bg)"/>
  <!-- subtle grid dots -->
  <g fill="#ffffff" fill-opacity="0.04">
    <circle cx="1140" cy="60" r="3"/><circle cx="1180" cy="60" r="3"/><circle cx="1220" cy="60" r="3"/>
    <circle cx="1140" cy="100" r="3"/><circle cx="1180" cy="100" r="3"/><circle cx="1220" cy="100" r="3"/>
    <circle cx="1140" cy="140" r="3"/><circle cx="1180" cy="140" r="3"/><circle cx="1220" cy="140" r="3"/>
  </g>

  <!-- glow -->
  <ellipse cx="980" cy="180" rx="220" ry="120" fill="#3ddc84" fill-opacity="0.10" filter="url(#soft)"/>

  <!-- phone -> desktop motif -->
  <g transform="translate(870,86)">
    <!-- phone -->
    <rect x="0" y="18" width="86" height="164" rx="16" fill="url(#glass)" stroke="#3ddc84" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="10" y="34" width="66" height="118" rx="6" fill="#0e1b2f"/>
    <circle cx="43" cy="166" r="6" fill="#3ddc84" fill-opacity="0.8"/>
    <!-- arrow -->
    <path d="M110 100 h70 m-14 -12 l14 12 l-14 12" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- monitor -->
    <rect x="196" y="26" width="210" height="132" rx="12" fill="url(#glass)" stroke="#4f8cff" stroke-opacity="0.85" stroke-width="2"/>
    <rect x="208" y="40" width="186" height="104" rx="6" fill="#0e1b2f"/>
    <rect x="220" y="52" width="70" height="12" rx="3" fill="#3ddc84" fill-opacity="0.7"/>
    <rect x="220" y="74" width="120" height="8" rx="3" fill="#4f8cff" fill-opacity="0.5"/>
    <rect x="220" y="90" width="98" height="8" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="220" y="106" width="140" height="8" rx="3" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="286" y="158" width="30" height="26" fill="url(#glass)"/>
    <rect x="256" y="184" width="90" height="10" rx="5" fill="#22304a"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(90,120)">
    <text x="0" y="0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Android<tspan fill="url(#accent)">-DEX</tspan></text>
    <text x="2" y="46" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="500" fill="#aebfd6">Seu Android vira desktop no Linux — e um toolkit de manutenção do aparelho.</text>
    <!-- chips -->
    <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">
      <g transform="translate(0,78)">
        <rect x="0" y="0" width="228" height="40" rx="20" fill="#12233c" stroke="#3ddc84" stroke-opacity="0.55"/>
        <circle cx="24" cy="20" r="6" fill="#3ddc84"/>
        <text x="40" y="26" fill="#dbe6f5">android-dex · sem root</text>
      </g>
      <g transform="translate(248,78)">
        <rect x="0" y="0" width="300" height="40" rx="20" fill="#12233c" stroke="#4f8cff" stroke-opacity="0.55"/>
        <circle cx="24" cy="20" r="6" fill="#4f8cff"/>
        <text x="40" y="26" fill="#dbe6f5">android-dex-flash · dry-run por padrão</text>
      </g>
    </g>
  </g>
</svg>
